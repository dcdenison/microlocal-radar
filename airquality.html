<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Air Quality · Microlocal Radar</title>
  <style>
    /* ============================================================
       SPEC C — Placemaking Report Design System
       Black field · white text · #f2ff00 accent · Courier everywhere
       2px hard borders · no radius · no shadows · no gradients
       Exception: AQI level colors are functional, not decorative —
       they stay.
       ============================================================ */

    :root {
      --bg:        #000000;
      --text:      #ffffff;
      --accent:    #f2ff00;
      --muted:     #999999;
      --border:    2px solid #ffffff;
      --border-accent: 2px solid #f2ff00;

      /* AQI level colors — functional, kept */
      --good:      #4caf50;
      --moderate:  #cddc39;
      --sensitive: #ff9800;
      --unhealthy: #f4511e;
      --very:      #9c27b0;
      --hazardous: #7b0000;

      --aqi-color: var(--good);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      user-select: none;
    }

    #app {
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      grid-template-columns: 1fr;
    }

    /* ── TOP: THE NUMBER ────────────────────────────────── */
    /* Sized for reading from a distance by people walking past.
       Sizes scale with BOTH screen width and height (whichever is
       tighter), so a 3-digit AQI like "152" still fits in portrait,
       and nothing overflows in landscape. */
    #hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-bottom: var(--border);
      min-height: 0;
      overflow: hidden;
    }

    #eyebrow {
      font-size: clamp(14px, min(3vw, 2.2vh), 26px);
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 1.5vh;
      text-align: center;
    }

    #aqi-number {
      font-size: clamp(140px, min(52vw, 38vh), 560px);
      font-weight: bold;
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: var(--aqi-color);
      font-variant-numeric: tabular-nums;
    }

    #aqi-label {
      margin-top: 2.5vh;
      font-size: clamp(26px, min(7vw, 5.5vh), 72px);
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      color: var(--aqi-color);
      border: 2px solid var(--aqi-color);
      padding: 6px 20px;
      max-width: 100%;
    }

    #plain-english {
      margin-top: 2.5vh;
      font-size: clamp(16px, min(3.6vw, 2.6vh), 34px);
      color: var(--text);
      opacity: 0.9;
      max-width: min(92%, 1000px);
      text-align: center;
      line-height: 1.45;
      min-height: 2.9em;
    }

    /* ── BOTTOM: DETAIL STRIP ───────────────────────────── */
    #strip {
      background: var(--bg);
      padding: 18px 20px 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 8px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: var(--border);
      padding: 10px 4px;
    }

    .stat-value {
      font-size: clamp(18px, 3.6vw, 28px);
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-size: clamp(9px, 1.5vw, 11px);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* ── AQI SCALE BAR ──────────────────────────────────── */
    #scale-row { grid-column: 1 / -1; margin-top: 6px; }

    #scale-bar {
      height: 10px;
      background: linear-gradient(to right,
        var(--good) 0%, var(--good) 20%,
        var(--moderate) 20%, var(--moderate) 33%,
        var(--sensitive) 33%, var(--sensitive) 50%,
        var(--unhealthy) 50%, var(--unhealthy) 66%,
        var(--very) 66%, var(--very) 83%,
        var(--hazardous) 83%, var(--hazardous) 100%
      );
      border: 1px solid #ffffff;
      position: relative;
      margin-bottom: 8px;
    }

    #scale-cursor {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 20px;
      background: #ffffff;
      border: 1px solid #000000;
      transform: translateX(-50%);
    }

    #scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: clamp(8px, 1.3vw, 10px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    #footer {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: clamp(9px, 1.4vw, 11px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #sensor-name { color: var(--accent); }
    #updated { color: var(--muted); }

    /* ── SETUP BANNER (shown when sensor unreachable) ─────── */
    #setup-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: var(--border-accent);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 10px 20px;
      text-align: center;
      z-index: 100;
      display: none;
    }

    #aqi-number.loading { opacity: 0.25; }
    #aqi-number.error   { font-size: clamp(48px, 10vw, 80px); opacity: 0.6; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<div id="app">

  <section id="hero" aria-live="polite" aria-label="Current air quality index">
    <div id="eyebrow">Air Quality Index · PM 2.5</div>
    <div id="aqi-number" class="loading">—</div>
    <div id="aqi-label">Loading…</div>
    <div id="plain-english"></div>
  </section>

  <section id="strip">
    <div class="stat">
      <div class="stat-value" id="stat-pm25">—</div>
      <div class="stat-label">PM 2.5 µg/m³</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-pm10">—</div>
      <div class="stat-label">PM 10 µg/m³</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-humidity">—</div>
      <div class="stat-label">Humidity %</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-temp">—</div>
      <div class="stat-label">Temp °F</div>
    </div>

    <div id="scale-row">
      <div id="scale-bar"><div id="scale-cursor"></div></div>
      <div id="scale-labels">
        <span>Good</span>
        <span>Moderate</span>
        <span>Sensitive</span>
        <span>Unhealthy</span>
        <span>Very</span>
        <span>Hazardous</span>
      </div>
    </div>

    <div id="footer">
      <div id="sensor-name">Microlocal Radar · ABHC</div>
      <div id="updated">—</div>
    </div>
  </section>

</div>

<div id="setup-banner">
  ⚙ Can't reach the sensor — check this device is on PPM-Local, and that the IP below is still correct.
</div>

<script>
// ════════════════════════════════════════════════════════════
//  CONFIGURATION
//  This page reads directly from the PurpleAir sensor's
//  LOCAL JSON feed (http://<sensor-IP>/json) — no cloud API,
//  no API key, no internet required.
//
//  IMPORTANT: this page must be loaded over plain http:// for
//  the local fetch to work. If this file is served from GitHub
//  Pages (https://), browsers will block the request as "mixed
//  content." Serve it locally instead — from Home Assistant
//  Green's www folder:
//    http://192.168.8.152:8123/local/airquality.html
//
//  If the sensor's IP ever changes, update SENSOR_IP below, or
//  override it in the URL: airquality.html?ip=192.168.8.187
// ════════════════════════════════════════════════════════════
const CONFIG = {
  SENSOR_IP:    '192.168.8.187',
  SENSOR_LABEL: 'Brighton Farmers Market',
  REFRESH_MS:   60 * 1000,   // refresh every 60 seconds
};

const params = new URLSearchParams(location.search);
if (params.get('ip'))    CONFIG.SENSOR_IP    = params.get('ip');
if (params.get('label')) CONFIG.SENSOR_LABEL = params.get('label');

// ── DEMO DATA (used if the sensor can't be reached) ──────────
const DEMO = {
  aqi: 42,
  pm25: 10.4,
  pm10: 14.2,
  humidity: 58,
  tempF: 71,
  sensorName: CONFIG.SENSOR_LABEL + ' (DEMO — sensor unreachable)',
};

// ── AQI BREAKPOINTS ──────────────────────────────────────────
function pm25toAQI(pm) {
  const bp = [
    [0,     12,    0,   50],
    [12.1,  35.4,  51,  100],
    [35.5,  55.4,  101, 150],
    [55.5,  150.4, 151, 200],
    [150.5, 250.4, 201, 300],
    [250.5, 500.4, 301, 500],
  ];
  for (const [clo, chi, ilo, ihi] of bp) {
    if (pm >= clo && pm <= chi) {
      return Math.round(((ihi - ilo) / (chi - clo)) * (pm - clo) + ilo);
    }
  }
  return pm > 500 ? 500 : 0;
}

const LEVELS = [
  { max: 50,  label: 'Good',               color: 'var(--good)',      text: 'Air quality is satisfactory. Good conditions for outdoor activities.' },
  { max: 100, label: 'Moderate',           color: 'var(--moderate)',  text: 'Air quality is acceptable. Very sensitive people may notice minor effects.' },
  { max: 150, label: 'Unhealthy for Some', color: 'var(--sensitive)', text: 'Sensitive groups — children, elderly, people with asthma — should limit prolonged outdoor exertion.' },
  { max: 200, label: 'Unhealthy',          color: 'var(--unhealthy)', text: 'Everyone may experience health effects. Sensitive groups should avoid outdoor exertion.' },
  { max: 300, label: 'Very Unhealthy',     color: 'var(--very)',      text: 'Health alert: everyone should avoid prolonged outdoor activity.' },
  { max: 999, label: 'Hazardous',          color: 'var(--hazardous)', text: 'Emergency conditions. Entire population is likely to be affected. Stay indoors.' },
];

function getLevel(aqi) {
  return LEVELS.find(l => aqi <= l.max) || LEVELS[LEVELS.length - 1];
}

// ── DOM REFS ─────────────────────────────────────────────────
const aqiEl     = document.getElementById('aqi-number');
const labelEl   = document.getElementById('aqi-label');
const plainEl   = document.getElementById('plain-english');
const pm25El    = document.getElementById('stat-pm25');
const pm10El    = document.getElementById('stat-pm10');
const humEl     = document.getElementById('stat-humidity');
const tempEl    = document.getElementById('stat-temp');
const cursorEl  = document.getElementById('scale-cursor');
const updatedEl = document.getElementById('updated');
const sensorEl  = document.getElementById('sensor-name');
const bannerEl  = document.getElementById('setup-banner');

// ── RENDER ───────────────────────────────────────────────────
function render(data) {
  const { aqi, pm25, pm10, humidity, tempF, sensorName } = data;
  const level = getLevel(aqi);

  aqiEl.textContent = aqi;
  aqiEl.classList.remove('loading', 'error');

  document.documentElement.style.setProperty('--aqi-color', level.color);
  labelEl.textContent = level.label;
  labelEl.style.borderColor = level.color;
  plainEl.textContent = level.text;

  pm25El.textContent = pm25 != null ? pm25.toFixed(1) : '—';
  pm10El.textContent = pm10 != null ? pm10.toFixed(1) : '—';
  humEl.textContent  = humidity != null ? Math.round(humidity) + '%' : '—';
  tempEl.textContent = tempF != null ? Math.round(tempF) + '°' : '—';

  // Place the white marker inside the bar section that matches the
  // AQI level (the sections aren't equal widths, so a straight 0–500
  // scale put the marker in the wrong section, e.g. 137 in "Moderate").
  const BANDS = [
    [0,   50,  0,  20],   // Good
    [50,  100, 20, 33],   // Moderate
    [100, 150, 33, 50],   // Sensitive
    [150, 200, 50, 66],   // Unhealthy
    [200, 300, 66, 83],   // Very Unhealthy
    [300, 500, 83, 100],  // Hazardous
  ];
  const a = Math.min(500, Math.max(0, aqi));
  const band = BANDS.find(([lo, hi]) => a <= hi) || BANDS[BANDS.length - 1];
  const pct = band[2] + ((a - band[0]) / (band[1] - band[0])) * (band[3] - band[2]);
  cursorEl.style.left = pct + '%';

  sensorEl.textContent = (sensorName || CONFIG.SENSOR_LABEL).toUpperCase();
  updatedEl.textContent = 'UPDATED ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function showError(msg) {
  aqiEl.textContent = '!';
  aqiEl.classList.add('error');
  labelEl.textContent = 'Data unavailable';
  plainEl.textContent = msg;
}

// ── FETCH FROM LOCAL PURPLEAIR SENSOR ─────────────────────────
async function fetchLive() {
  const url = `http://${CONFIG.SENSOR_IP}/json`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Sensor HTTP ${res.status}`);
  const j = await res.json();

  // Sensor has two internal channels (A / no-suffix, B / "_b").
  // Averaging them gives a steadier reading than either alone.
  const chanA_pm25 = parseFloat(j.pm2_5_atm);
  const chanB_pm25 = parseFloat(j.pm2_5_atm_b);
  const chanA_pm10 = parseFloat(j.pm10_0_atm);
  const chanB_pm10 = parseFloat(j.pm10_0_atm_b);

  const pm25 = (Number.isFinite(chanA_pm25) && Number.isFinite(chanB_pm25))
    ? (chanA_pm25 + chanB_pm25) / 2
    : (chanA_pm25 || chanB_pm25 || 0);

  const pm10 = (Number.isFinite(chanA_pm10) && Number.isFinite(chanB_pm10))
    ? (chanA_pm10 + chanB_pm10) / 2
    : (chanA_pm10 || chanB_pm10 || 0);

  const humidity = parseFloat(j.current_humidity);
  const tempF    = parseFloat(j.current_temp_f);
  const name     = j.Geo || CONFIG.SENSOR_LABEL;

  return {
    aqi: pm25toAQI(pm25),
    pm25, pm10,
    humidity: Number.isFinite(humidity) ? humidity : null,
    tempF: Number.isFinite(tempF) ? tempF : null,
    sensorName: name,
  };
}

// ── MAIN LOOP ────────────────────────────────────────────────
async function refresh() {
  try {
    const data = await fetchLive();
    bannerEl.style.display = 'none';
    render(data);
  } catch (e) {
    console.error('Local sensor fetch error:', e);
    bannerEl.style.display = 'block';
    render(DEMO);
  }
}

refresh();
setInterval(refresh, CONFIG.REFRESH_MS);
</script>
</body>
</html>
